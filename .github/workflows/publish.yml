name: Release and publish to PyPI

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number to release (e.g., 3.2.0)'
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/min-js/
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          VERSION='${{ inputs.version }}'
          sed -i "s/__version__ = '[^']*'/__version__ = '${VERSION}'/" js_min/__init__.py
          grep "__version__" js_min/__init__.py

      - name: Commit and push version bump
        run: |
          VERSION='${{ inputs.version }}'
          git add js_min/__init__.py
          git commit -m "Bump version to ${VERSION}"
          git push origin main

      - name: Create and push tag
        run: |
          VERSION='${{ inputs.version }}'
          git tag "v${VERSION}"
          git push origin "v${VERSION}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION='${{ inputs.version }}'
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Release min-js ${VERSION}" \
            --target main

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install build tools
        run: python -m pip install --upgrade build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
